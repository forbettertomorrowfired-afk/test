services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: atomquest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/atomquest"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
